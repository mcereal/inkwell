name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug (gcc)
            cc: gcc
            args: ""
            submodules: recursive
          # clang as well as gcc, and not for the sanitizers alone: the two disagree about
          # whether a conversion between two enum types, an incompatible function pointer and an
          # implicit declaration are warnings or errors. A consumer building this with clang
          # should not be the one to find out.
          - name: debug (clang)
            cc: clang
            args: ""
            submodules: recursive
          - name: asan+ubsan (clang)
            cc: clang
            args: "-DINKWELL_ENABLE_ASAN=ON -DINKWELL_ENABLE_UBSAN=ON"
            submodules: recursive
          # The same tree with no submodules at all, which is what `git clone` on its own gives
          # and therefore what somebody evaluating this gets. Mbed TLS is the only optional
          # dependency here and net/tls.c compiles to a stub without it, so this job holds the
          # claim that the stub is real: it builds, it links, and every case that is not about
          # TLS still runs. Without it that claim would be checked by nobody, and the first
          # person to find out would be the one who cloned.
          - name: no TLS (gcc)
            cc: gcc
            args: ""
            submodules: ""
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ matrix.submodules }}

      # Mbed TLS 4.x generates error.c, the SSL debug helpers and the PSA driver wrappers at
      # build time rather than committing them, and the generator is Python with jinja2. The
      # no-TLS job does not need it and does not pay for it.
      - name: Install the Mbed TLS generator's prerequisites
        if: matrix.submodules == 'recursive'
        run: python3 -m pip install --user jinja2

      # libclang-rt-18-dev is the one that is easy to miss: Ubuntu's clang package does not pull
      # the sanitizer runtimes in, and without them the link fails looking for
      # libclang_rt.asan-x86_64.a rather than at anything to do with this code.
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-rt-18-dev

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug ${{ matrix.args }}

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  # macOS is a development host, not a target: the loop is kqueue there and the suite is the same
  # suite. It is here because a Linux-only call above runtime/ compiles fine on every other job,
  # and this is the one that would fail on it.
  macos:
    name: debug (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A venv because Homebrew's Python refuses a --user install (PEP 668), and passed to CMake
      # by path because the generator otherwise finds that Homebrew Python first.
      - name: Install build tools
        run: |
          brew install ninja
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install jinja2 jsonschema

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DPython3_EXECUTABLE="$RUNNER_TEMP/venv/bin/python3"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      # Through the Makefile, so the file list lives in exactly one place. It used to be
      # duplicated here, and the day third_party/ was excluded from `make format` this job
      # went on checking a 3.6 MB vendored file and failed.
      - name: Check formatting
        run: make format-check CLANG_FORMAT=clang-format-18
