name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug (gcc)
            cc: gcc
            args: ""
          # clang as well as gcc, and not for the sanitizers alone: the two disagree about
          # whether a conversion between two enum types, an incompatible function pointer and an
          # implicit declaration are warnings or errors. A consumer building this with clang
          # should not be the one to find out.
          - name: debug (clang)
            cc: clang
            args: ""
          - name: asan+ubsan (clang)
            cc: clang
            args: "-DINKWELL_ENABLE_ASAN=ON -DINKWELL_ENABLE_UBSAN=ON"
    steps:
      - uses: actions/checkout@v4

      # libclang-rt-18-dev is the one that is easy to miss: Ubuntu's clang package does not pull
      # the sanitizer runtimes in, and without them the link fails looking for
      # libclang_rt.asan-x86_64.a rather than at anything to do with this code.
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-rt-18-dev

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug ${{ matrix.args }}

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: clang-format-18 --dry-run --Werror $(git ls-files '*.c' '*.h')
